name = "megamind-labs-ui-mcp"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The kit's rules, reference, starter page and stylesheet are imported as text and bundled.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.html", "**/*.css"]
fallthrough = true

# Serves the connector icon (/icon.png) and /favicon.ico. Everything else goes to the Worker.
[assets]
directory = "./worker/assets"
